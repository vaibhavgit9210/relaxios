# plains: "Distant Storm". Sourced by render_all.sh.
# hero: 12,3.65
SS=2            # cloud silhouettes against the sky stair-step at ss1; ss2 smooths them.
                # Bench 1080x1920 ss2 on an idle GPU: ~280 ms/frame median, ~290 mean.
XFADE=8         # billows drift slowly and are not periodic; a long fade hides the seam
SEED=1
CRF=18          # calm, dark scene: ~4 MB per 720p loop even at 18, well inside budget
# The scene is continuous across the wrap (lossless stills, no dither, 540x960
# ss2: 0.18 10-bit codes last->first vs 0.145 for an ordinary consecutive pair).
# But on a scene this still, x265 freezes the harness dither in P-frames and
# refreshes it at each I-frame, so EVERY 2 s keyframe boundary measures about
# 2.3 codes against a ~0.2 median (measured in the preview encode: frames
# 59->60 2.31, 599->600 2.29). Frame 0 is a keyframe too, so the wrap reads
# 2.15 (portrait) / 2.36 (landscape). A 2.5-code floor (about 0.6 of an 8-bit
# code) passes that and still catches a visible seam.
CHECK=(--seam-floor 2.5)
