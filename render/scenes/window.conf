# window: Rain on the Window. Sourced by render_all.sh (see _test.conf).
# Every element is an exact function of time mod the loop (drop slides, bead
# impacts, cars, rain, blinkers, light fades, lightning, and clouds on a
# periodic noise axis), so no crossfade is needed: frame N equals frame 0.
SS=2
XFADE=0
SEED=1
# Seam floor: the scene is exactly periodic (lossless stills at t=0 and t=L
# are bit-identical; the raw t=L-1/30 -> t=0 step is 4.91 codes vs 4.98 for
# t=0 -> 1/30), so the only last->first difference is x265 re-coding frame 0
# as a keyframe, where the film grain is refreshed. Measured on a 960x540
# preview: seam 8.54 codes, the 19 internal keyframe steps 7.41..12.41
# (median 8.49), non-keyframe steps median 3.60. The default 2 x median + 0.5
# reads that ordinary keyframe step as a seam (landscape ratio 2.27 before
# this polish pass, 2.37 after). A 2-code floor (0.5 of an 8-bit code) passes
# it and still catches a real seam.
CHECK=(--seam-floor 2.0)
# hero: 26.5,3.1
