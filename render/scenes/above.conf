# above: "Above the Storm". Sourced by render_all.sh (see _test.conf).
# hero: 11,1.55
#
# SS=1: the shader anti-aliases itself (stars are Gaussians of at least 0.6 px,
# cloud edges are softened to at least ~1.2 px by the pixel footprint, noise
# octaves fade out below 4 px, tower fringes are marched with finer steps so
# silhouettes do not stair-step or tear). ss2 costs about 4x: measured GPU time
# at 1080x1920 (min of interleaved medians, M1 shared with other renders) is
# ~350 ms/frame at ss1, against ~1.2 s at ss2, so ss1 it is. 720p stills match
# 1080p apart from sharpness.
SS=1
# Exactly periodic (clouds breathe with integer frequencies, the camera floats
# on a closed ellipse, lightning uses since_event): no crossfade needed.
XFADE=0
SEED=1
# CRF 20 with equal I/P/B quality keeps the film grain alive frame to frame and
# stops the near-static sky from "pumping" at every 2 s keyframe. 720p gets
# CRF 21: landscape 720 ran ~2.1 Mbps in a busy stretch, close to 11 MB.
CRF_1080=20
CRF_720=21
EXTRA=(--x265 "aq-mode=3:ipratio=1.0:pbratio=1.0")
# The scene is exactly periodic (stills at t=0 and t=L match to 0.1 8-bit
# codes), so the only last->first difference is x265 re-coding the film grain
# at the frame-0 keyframe, the same step as at the file's other 19 keyframes.
# Measured on full-loop 288x512 / 512x288 previews: seam 3.8 / 4.5, internal
# keyframe steps 3.1..4.6 ten-bit codes, median consecutive difference only
# 0.75 / 0.8 because x265 smooths the grain inside each GOP. The default floor
# (0.5) reads that keyframe step as a seam; 4 codes is one 8-bit step, below
# visibility. Flash checks use the defaults and pass with a wide margin
# (largest mean Y' step 0.05, no large flashes, events at most 7.3 s apart).
CHECK=(--seam-floor 4.0)
