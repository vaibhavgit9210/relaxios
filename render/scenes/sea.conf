# Storm at Sea. The sea, rain, foam, beam and lightning loop exactly; only the
# cloud drift does not, so the crossfade is long to keep its contrast dip gentle.
# No check_video overrides: both orientations pass the default seam and flash
# thresholds (largest frame step 0.064 portrait, 0.031 landscape; warn 0.10).
# SS=3 was tried for the glitter and rejected: about 440 ms/frame at 1080x1920,
# over budget. The aliasing is handled in the shader instead.
# hero: 6.0,17.35
SS=2
XFADE=8
SEED=1
