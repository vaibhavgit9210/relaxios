# Per-scene render settings, sourced by render_all.sh. Copy to <id>.conf.
# Unset or empty values fall back to the storm-render / check_video.py defaults.
SS=2            # supersample factor (1-3); see README for GPU cost
XFADE=6         # loop crossfade seconds, 0 if the scene is exactly periodic
SEED=1
# CRF=22        # both resolutions
# CRF_1080=     # per-resolution override
# CRF_720=
# PRESET=slow
# MAXRATE_1080=4000   # kbps cap; keep inside the 22 MB / 11 MB budget
# MAXRATE_720=2000
# EXTRA=(--define RAIN_DENSITY=0.8)
# CHECK=(--max-jump 0.12)
